# This is a ci file for building and testing covmap.
image: ubuntu:22.04

stages:
  - build

before_script:
  - apt-get update -qy
  - apt-get install -y software-properties-common curl wget build-essential git vim nano htop tree net-tools iputils-ping dnsutils unzip jq
  - apt-get install -y python3 python3-pip
  - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.92.0 --component rustfmt --component clippy
  - . "$HOME/.cargo/env"

build_job:
  tags:
    - stardust
  script:
    - echo "Now I'm running on Stardust"
    - pwd
    - tree -L 2
    - . "$HOME/.cargo/env"
    # formatting, lints, release build
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo build --release
    # unit tests and end-to-end smoke test
    - cargo test --all
    - ./smoke_test/run.sh
  stage: build

